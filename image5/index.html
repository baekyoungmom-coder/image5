<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>image5 · 오늘 만든 사진</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background: linear-gradient(180deg, #020617 0%, #111827 100%);
      color: #e5e7eb;
      padding: 40px 18px;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .hero {
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      border-radius: 28px;
      padding: 28px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 10px; font-size: 36px; }
    p { margin: 0; line-height: 1.7; color: #cbd5e1; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .card {
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }
    .card img {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #0f172a;
    }
    .cap {
      padding: 14px 16px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .footer {
      margin-top: 24px;
      font-size: 14px;
      color: #94a3b8;
    }
    code {
      background: rgba(255,255,255,.08);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>오늘 만든 사진 5장</h1>
      <p>
        이 폴더를 GitHub에 올리면 Vercel에서 바로 공유할 수 있어요.
        이미지 파일은 <code>images/</code> 폴더에 넣고, 이 페이지가 자동으로 보여줍니다.
      </p>
    </section>

    <section class="grid">
      <article class="card"><img src="images/photo-1.png" alt="photo 1"><div class="cap">Photo 1</div></article>
      <article class="card"><img src="images/photo-2.png" alt="photo 2"><div class="cap">Photo 2</div></article>
      <article class="card"><img src="images/photo-3.png" alt="photo 3"><div class="cap">Photo 3</div></article>
      <article class="card"><img src="images/photo-4.png" alt="photo 4"><div class="cap">Photo 4</div></article>
      <article class="card"><img src="images/photo-5.png" alt="photo 5"><div class="cap">Photo 5</div></article>
    </section>

    <div class="footer">
      경로 예시: <code>index.html</code>, <code>images/photo-1.png</code> ~ <code>images/photo-5.png</code>
    </div>
  </div>
</body>
</html>
